name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      META_LOOP_TEST_POSTGRES_DSN: postgresql://meta_loop_test:meta_loop_test_pw_ci@127.0.0.1:5432/meta_loop_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meta_loop_test
          POSTGRES_USER: meta_loop_test
          POSTGRES_PASSWORD: meta_loop_test_pw_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meta_loop_test -d meta_loop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[postgres-test]" pytest

      - name: Run full test suite
        run: python -m pytest -q -rs

      - name: Compile source and tests
        run: python -m compileall -q src tests
