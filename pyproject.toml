[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-loop"
version = "0.0.0"
description = "Independent, fail-closed maintenance orchestration system"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
meta-loop = "meta_loop.cli.main:main"

[project.optional-dependencies]
postgres-test = ["psycopg[binary]>=3.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
