[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-loop"
version = "0.0.0"
description = "Independent Meta Loop bootstrap scaffold"
requires-python = ">=3.11"

[project.optional-dependencies]
postgres-test = ["psycopg[binary]>=3.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
